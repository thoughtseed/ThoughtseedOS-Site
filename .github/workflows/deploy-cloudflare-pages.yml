# Auto-deploy Thoughtseed main site (Digital Wilderness) to Cloudflare Pages.
# Project: thoughtseed-os-site  |  Domains: thoughtseed.space, www.thoughtseed.space
# System prep: first green path for agent/Hermes/quests deploy canaries.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-thoughtseed-os-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA redirects for Pages
        run: printf '/*    /index.html   200\n' > dist/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=thoughtseed-os-site --branch=main
